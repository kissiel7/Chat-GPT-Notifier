<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT Notifier</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>ChatGPT Notifier</h1>
    <div class="row"><span>Chat</span><strong id="title">—</strong></div>
    <div class="row"><span>In scope</span><strong id="scope">—</strong></div>
    <div class="row"><span>Matched rule</span><strong id="matchedRule">—</strong></div>
    <div class="row"><span>Title source</span><strong id="titleSource">—</strong></div>
    <div class="row"><span>State</span><strong id="state">—</strong></div>
    <div class="row"><span>Last event</span><strong id="event">—</strong></div>
    <div class="row"><span>Composer</span><strong id="composer">—</strong></div>
    <div class="row"><span>Stop seen</span><strong id="stopSeen">—</strong></div>
    <div class="row"><span>Delivery</span><strong id="delivery">—</strong></div>
    <div class="row"><span>Desktop</span><strong id="desktop">—</strong></div>
    <div class="row"><span>ntfy</span><strong id="ntfy">—</strong></div>
    <button id="options" type="button">Settings</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
