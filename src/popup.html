<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT Notifier</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>ChatGPT Notifier</h1>
      <span id="version" class="version">v—</span>
    </header>

    <div class="row"><span>Chat</span><strong id="title">—</strong></div>
    <div class="row"><span>In scope</span><strong id="scope">—</strong></div>
    <div class="row"><span>Matched rule</span><strong id="matchedRule">—</strong></div>

    <button id="toggleScope" class="primary" type="button" disabled>Loading…</button>
    <div id="actionStatus" class="status" role="status"></div>

    <section class="dashboard">
      <div class="section-heading">
        <h2>Monitored tabs</h2>
        <span id="runningSummary" class="section-meta">loading…</span>
      </div>
      <div id="monitoredTabs" class="chat-list">
        <div class="empty">Loading monitored chats…</div>
      </div>
    </section>

    <section class="delivery">
      <h2>Notifications</h2>
      <div class="row"><span>Windows</span><strong id="desktop">—</strong></div>
      <div class="row"><span>Mobile</span><strong id="ntfy">—</strong></div>
      <div class="button-grid">
        <button id="testDesktop" type="button">Test Windows</button>
        <button id="testNtfy" type="button">Test mobile</button>
      </div>
    </section>

    <details>
      <summary>Diagnostics</summary>
      <div class="details-body">
        <div class="row"><span>Title source</span><strong id="titleSource">—</strong></div>
        <div class="row"><span>State</span><strong id="state">—</strong></div>
        <div class="row"><span>Last event</span><strong id="event">—</strong></div>
        <div class="row"><span>Composer</span><strong id="composer">—</strong></div>
        <div class="row"><span>Stop seen</span><strong id="stopSeen">—</strong></div>
        <div class="row"><span>Detector delivery</span><strong id="delivery">—</strong></div>
        <div class="row"><span>Deployment</span><strong id="deployment">checking…</strong></div>
      </div>
    </details>

    <button id="options" class="secondary" type="button">Settings</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
